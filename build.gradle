plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
    // Gives us an accurate, Mojang-mapped compile classpath (NMS classes
    // like ServerPlayer/AnvilMenu/AbstractContainerMenu) for the helper and
    // stub classes below. Paper/Folia 26.1+ ship Mojang-mapped (unobfuscated)
    // server code at runtime and paperweight no longer reobfuscates, so this
    // is dev-time only. 2.0.0-beta.20+ is required for the 26.x dev bundles.
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.24'
}

group = 'net.sideways_sky.geyserrecipefixpatcher'
version = '1.1.0'

repositories {
    mavenCentral()
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
}

dependencies {
    // Note: paperDevBundle already includes the full mapped Paper API, so
    // it replaces a plain paper-api dependency here rather than sitting
    // alongside one (avoids two copies of the Bukkit API on the classpath).
    //
    // 26.x uses "<minecraft version>.build.<n>" dev bundle versions (before
    // 26.1 it was "1.21.x-R0.1-SNAPSHOT"). "26.3.build.+" tracks the newest
    // 26.3 build; Folia runs the same Mojang-mapped names, so a Paper bundle
    // is the right thing to compile against for both.
    compileOnly paperweight.paperDevBundle("26.3.build.+")

    // 9.9+ so a future upstream jar built for a newer Java than 21 can
    // still be read (older ASM rejects class files newer than it knows).
    implementation 'org.ow2.asm:asm:9.9.1'
    implementation 'org.ow2.asm:asm-tree:9.9.1'
    implementation 'org.ow2.asm:asm-commons:9.9.1'
}

// Minecraft 26.x requires Java 25, and the 26.x dev bundle is Java 25
// bytecode, so javac needs --release 25 to read it.
def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(targetJavaVersion)
}

// FoliaRuntimeSupport/FoliaAnvilBridge/AnvilRenameFix (the classes we splice
// into the downloaded jar) AND their compile-only stand-ins for the real
// GeyserRecipeFix/PaperEvents/AnvilSim classes (see PATCHES.md) all live as
// ordinary members of the `main` source set - that's the only way found to
// get paperweight's Mojang-mapped NMS classpath applied to them reliably; a
// separate custom source set doesn't reliably pick it up even when the dev
// bundle dependency is added directly to its own compileOnly configuration.
// After compileJava runs, copy just the three real helper classes into
// resources/main/injected/, so at runtime we can read their raw bytes and
// splice them into the freshly downloaded, official GeyserRecipeFix.jar
// (see JarPatcher). shadowJar then excludes the whole
// net/sideways_sky/geyserrecipefix/** path (below) - covering the helper
// classes' own path AND the stand-ins - so none of it ships as directly
// loadable classes on our own plugin's runtime classpath; only the
// `injected/` copies do, and those are never loaded by our own plugin, only
// read as bytes.
tasks.register('bundleInjectedClasses', Copy) {
    dependsOn tasks.named('compileJava')
    from tasks.named('compileJava').map { it.destinationDirectory }
    into layout.buildDirectory.dir('resources/main/injected')
    include 'net/sideways_sky/geyserrecipefix/FoliaRuntimeSupport.class'
    include 'net/sideways_sky/geyserrecipefix/events/FoliaAnvilBridge.class'
    include 'net/sideways_sky/geyserrecipefix/inventories/AnvilRenameFix.class'

    // Guard: every injected class must be exactly ONE .class file. A nested,
    // inner or anonymous class (Outer$Inner.class) would be a second file
    // that neither this task nor JarPatcher copies into the patched jar, so
    // the feature would die at runtime with NoClassDefFoundError. Fail the
    // build instead of shipping that. (Lambdas are fine - they don't create files.)
    doFirst {
        def classesDir = tasks.named('compileJava').get().destinationDirectory.get().asFile
        def nested = fileTree(classesDir) { include 'net/sideways_sky/geyserrecipefix/**/*$*.class' }
        if (!nested.isEmpty()) {
            throw new GradleException('Injected classes must not have nested/inner/anonymous classes, but found: '
                    + nested.files*.name.join(', '))
        }
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('bundleInjectedClasses')
}

tasks.named('shadowJar') {
    archiveClassifier.set('')
    // Deliberately NOT relocating org.objectweb.asm here: Shadow 8.3.5's
    // Groovy-based ASM remapper has a bug (MissingMethodException in
    // RelocatorRemapper.mapValue) when it processes invokedynamic
    // instructions - which any class using a lambda emits, including our
    // own plugin classes - while doing a package relocation pass. Skipping
    // relocation avoids that remap pass entirely. This is safe here: Paper
    // gives each plugin its own isolated classloader, so bundling ASM
    // un-relocated in our own jar won't collide with another plugin's copy.
    exclude 'net/sideways_sky/geyserrecipefix/**'
}

// shadowJar uses an empty classifier (so the final file is simply
// GeyserRecipeFixPatcher-<version>.jar); give the plain jar its own
// classifier so the two tasks can never write the same file.
tasks.named('jar') {
    archiveClassifier.set('plain')
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

processResources {
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: version)
    }
}
